<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Budget vs actual preview</title>
    <style>
        html, body { margin: 0; background: #f1f5f9; font-family: "Segoe UI", sans-serif; }
        /* Large enough for showcase shots so layout never needs scrollbars */
        #host { width: 1280px; height: 860px; margin: 20px; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); }
        #log { margin: 0 20px 20px; min-height: 20px; color: #323130; font-size: 12px; }
        .bva-host { display: flex; flex-direction: column; overflow: hidden; }
        .bva-scroll { flex: 1 1 auto; min-height: 0; overflow: hidden; }
        .bva-scroll svg { display: block; }
        body.shot #log { display: none; }
        body.shot #host { margin: 0; border: 0; border-radius: 0; box-shadow: none; }
    </style>
    <script>
        var modules = {};
        function define(name, deps, factory) { modules[name] = { deps: deps, factory: factory, exports: null }; }
        function requireModule(name) {
            var entry = modules[name];
            if (entry.exports) return entry.exports;
            entry.exports = {};
            var args = entry.deps.map(function (dep) {
                if (dep === "require") return requireModule;
                if (dep === "exports") return entry.exports;
                return requireModule(dep);
            });
            entry.factory.apply(null, args);
            return entry.exports;
        }
    </script>
</head>
<body>
    <div id="host" class="bva-host"></div>
    <div id="log"></div>
    <script src="preview.js"></script>
    <script>requireModule("demo/main");</script>
</body>
</html>
